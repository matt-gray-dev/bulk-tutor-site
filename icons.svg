<svg xmlns="http://www.w3.org/2000/svg">
<!-- Bulk Tutor's icons, one <symbol> each, used as <svg><use href="icons.svg#NAME"/></svg>.
     To replace one, keep its id and viewBox (a 24 x 24 grid) and draw in currentColor, so the app can colour it
     (grey, or purple when selected). Each symbol sets its own fill and stroke; the app sets only sizes and, for
     outline icons, stroke-width. The full list, at real sizes in both themes: design/icons.html. -->

<!-- Interface icons (outlines today). -->
<!-- Workbench tab (a hammer) -->
<symbol id="i-workbench" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5l9.6-9.6"/><path d="M11.6 6.9l3.1-3.1 5.5 5.5-3.1 3.1z"/></g></symbol>
<!-- Collection tab (a grid of cards) -->
<symbol id="i-collection" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="4.5" height="5.5" rx="1"/><rect x="9.75" y="3" width="4.5" height="5.5" rx="1"/><rect x="15.5" y="3" width="4.5" height="5.5" rx="1"/><rect x="4" y="9.75" width="4.5" height="5.5" rx="1"/><rect x="9.75" y="9.75" width="4.5" height="5.5" rx="1"/><rect x="15.5" y="9.75" width="4.5" height="5.5" rx="1"/><rect x="4" y="16.5" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="16.5" width="4.5" height="4.5" rx="1"/><rect x="15.5" y="16.5" width="4.5" height="4.5" rx="1"/></g></symbol>
<!-- Find decks tab (a magnifying glass) -->
<symbol id="i-find" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></g></symbol>
<!-- Combos tab (an infinity loop) -->
<symbol id="i-combos" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 15.5a3.5 3.5 0 1 1 0-7c3 0 6 7 9 7a3.5 3.5 0 1 0 0-7c-3 0-6 7-9 7z"/></g></symbol>
<!-- Settings, the gear at the top right -->
<symbol id="i-settings" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></g></symbol>
<!-- inside search fields -->
<symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></g></symbol>
<!-- a saved filter, on its chip -->
<symbol id="i-bookmark" viewBox="0 0 24 24"><g fill="none" stroke="currentColor"><path d="M6 3h12v18l-6-4-6 4z"/></g></symbol>

<!-- Location icons: one flat colour (currentColor), details as cut-outs, drawn on a coloured tile. -->
<!-- Deck box -->
<symbol id="li-deckbox" viewBox="0 0 24 24"><g fill="currentColor"><path fill-rule="evenodd" d="M7.5 3.5h9A2.5 2.5 0 0 1 19 6v13a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 19V6a2.5 2.5 0 0 1 2.5-2.5zM5 8.6h14v1.5H5z"/></g></symbol>
<!-- Binder -->
<symbol id="li-binder" viewBox="0 0 24 24"><g fill="currentColor"><path fill-rule="evenodd" d="M6.5 2.5h12A1.5 1.5 0 0 1 20 4v16a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 5 20V4a1.5 1.5 0 0 1 1.5-1.5zM8.6 6.2a1.3 1.3 0 1 0 0 2.6a1.3 1.3 0 1 0 0-2.6zM8.6 10.7a1.3 1.3 0 1 0 0 2.6a1.3 1.3 0 1 0 0-2.6zM8.6 15.2a1.3 1.3 0 1 0 0 2.6a1.3 1.3 0 1 0 0-2.6z"/></g></symbol>
<!-- Storage box -->
<symbol id="li-box" viewBox="0 0 24 24"><g fill="currentColor"><path d="M3 5.5h18a1 1 0 0 1 1 1v2.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1z"/><path fill-rule="evenodd" d="M3.2 11h17.6v7.5a1.5 1.5 0 0 1-1.5 1.5H4.7a1.5 1.5 0 0 1-1.5-1.5zM9 13.2h6v2.4H9z"/></g></symbol>
<!-- Tin or crate -->
<symbol id="li-tin" viewBox="0 0 24 24"><g fill="currentColor"><rect x="2.8" y="4.5" width="18.4" height="4" rx="2"/><path d="M4 9.8h16v8.2a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/></g></symbol>
<!-- Pile or other -->
<symbol id="li-pile" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3.5" y="6.5" width="10" height="14" rx="1.5" transform="rotate(-14 8.5 13.5)"/><rect x="10" y="4" width="10" height="14" rx="1.5" transform="rotate(10 15 11)" style="stroke: var(--lc, var(--surface)); stroke-width: 1.6"/></g></symbol>
<!-- Saved decklist (not a physical place) -->
<symbol id="li-list" viewBox="0 0 24 24"><g fill="currentColor"><path fill-rule="evenodd" d="M6.5 2.5h11A1.5 1.5 0 0 1 19 4v16a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V4a1.5 1.5 0 0 1 1.5-1.5zM8 7h8v1.4H8zM8 10.8h8v1.4H8zM8 14.6h5.5V16H8z"/></g></symbol>
<!-- All cards (every location at once) -->
<symbol id="li-all" viewBox="0 0 24 24"><g fill="currentColor"><rect x="4" y="3" width="13" height="16" rx="1.5" opacity=".45"/><rect x="7" y="6" width="13" height="16" rx="1.5"/></g></symbol>
</svg>
